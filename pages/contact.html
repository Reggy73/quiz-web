<!DOCTYPE html>
<html>
    <head>
        <title>Quiz Central</title>
        <link rel="stylesheet" href="../src/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    </head>
    <body>
        <header>
            <h2><i class="fa-solid fa-book-open"></i> QUIZ CENTRAL <i class="fa-solid fa-atom"></i></h2>
        </header>
        <nav>
            <a href="../index.html">Home</a>
            <a href="quizzes.html">Quizzes</a>
            <a href="tests.html">Tests</a>
            <a href="registration.html">Registration</a>
            <a href="contact.html">Contact Us</a>
        </nav>
        <main>
            <section id="contact-section">
                <article id="section-heading">
                    <h2>GET IN TOUCH WITH US</h2>
                </article>
                <form id="contact-form" action="/contact" method="post">
                    <h2>Contact Us</h2>
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name" placeholder="Enter your Full Name" required>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your Email" required>
                    <textarea name="message" placeholder="Enter your message"></textarea>
                    <button type="submit">Send message</button>
                </form>
                <aside>
                    <h2>Contact Info</h2>
                    <address>
                        <ul>
                            <li><span><i class="fa-solid fa-phone"></i></span><span><b>Phone:</b><br><a href="tel:+1 (555) 123-4567">+1 (555) 123-4567</a></span></li>
                            <li><span><i class="fa-solid fa-envelope"></i></span><span><b>Email:</b><br><a href="mailto:quizcentral@email.com">quizcentral@email.com</a></span></li>
                            <li><span><i class="fa-solid fa-location-dot"></i></span><span><b>Location:</b><br><span>22089 Samora Avenue, Dar es Salaam</span> </span></li>
                        </ul>
                    </address>
                </aside>
                <footer>&copy; Quiz Central | All Rights Reserved</footer>
            </section>
        </main>
    </body>
</html>

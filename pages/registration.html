<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz Central</title>
        <link rel="stylesheet" href="../src/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    </head>
    <body>
        <header>
            <h2><i class="fa-solid fa-book-open"></i> QUIZ CENTRAL <i class="fa-solid fa-atom"></i></h2>
        </header>
        <nav>
            <a href="../index.html">Home</a>
            <a href="quizzes.html">Quizzes</a>
            <a href="tests.html">Tests</a>
            <a href="registration.html">Registration</a>
            <a href="contact.html">Contact Us</a>
        </nav>
        <main>
            <section>
                <article id="section-heading">
                    <h2>CREATE YOUR ACCOUNT</h2>
                </article>
                <form action="/register" method="post">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name" placeholder="Enter your name">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                    <label for="password-confirm">Confirm Password</label>
                    <input type="password" id="password-confirm" name="password-confirm" placeholder="Confirm your Password">
                    <button type="submit">Register Now</button>
                </form>
                <p id="login-link">Already have an account? <a href="login.html">Login here</a></p>
                <footer>&copy; Quiz Central | All Rights Reserved</footer>
            </section>
        </main>
    </body>
</html>
